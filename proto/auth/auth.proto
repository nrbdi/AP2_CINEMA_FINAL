syntax = "proto3";
package auth;
option go_package = "cinema/api-gateway/proto/auth";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetProfile(GetProfileRequest) returns (UserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;
  string role = 5;
  string created_at = 6;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
}
message RegisterResponse {
  User user = 1;
  string message = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message LogoutRequest { string access_token = 1; }
message LogoutResponse { bool success = 1; }

message RefreshTokenRequest { string refresh_token = 1; }

message ValidateTokenRequest { string token = 1; }
message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}

message GetProfileRequest { string user_id = 1; }
message UpdateProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
}
message UserResponse { User user = 1; }

message DeleteUserRequest { string user_id = 1; }
message DeleteUserResponse { bool success = 1; }

services:
  # ── Databases ─────────────────────────────────────────────
  postgres-movie:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema_movie
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
    ports:
      - "5442:5432"
    volumes:
      - pg_movie:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d cinema_movie"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema_auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5443:5432"
    volumes:
      - pg_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d cinema_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema_payment
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5444:5432"
    volumes:
      - pg_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d cinema_payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Caches ────────────────────────────────────────────────
  redis-movie:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_movie:/data

  redis-auth:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_auth:/data

  # ── Message Queue ─────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--jetstream --http_port 8222"

  # ── Microservices ─────────────────────────────────────────
  movie-service:
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    environment:
      - DB_URL=postgres://movie_user:movie_pass@postgres-movie:5432/cinema_movie?sslmode=disable
      - REDIS_URL=redis-movie:6379
      - NATS_URL=nats://nats:4222
      - GRPC_PORT=50051
    ports:
      - "50051:50051"
    depends_on:
      postgres-movie:
        condition: service_healthy
      redis-movie:
        condition: service_started
      nats:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - DB_URL=postgres://auth_user:auth_pass@postgres-auth:5432/cinema_auth?sslmode=disable
      - REDIS_URL=redis-auth:6379
      - GRPC_PORT=50052
      - JWT_SECRET=super-secret-jwt-key-change-in-production
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=7d
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "50052:50052"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      - DB_URL=postgres://payment_user:payment_pass@postgres-payment:5432/cinema_payment?sslmode=disable
      - NATS_URL=nats://nats:4222
      - GRPC_PORT=50053
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "50053:50053"
    depends_on:
      postgres-payment:
        condition: service_healthy
      nats:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      - HTTP_PORT=8080
      - MOVIE_SERVICE_ADDR=movie-service:50051
      - AUTH_SERVICE_ADDR=auth-service:50052
      - PAYMENT_SERVICE_ADDR=payment-service:50053
      - JWT_SECRET=super-secret-jwt-key-change-in-production
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    ports:
      - "8080:8080"
    depends_on:
      - movie-service
      - auth-service
      - payment-service
      - tempo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - api-gateway

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./monitoring/loki-data:/loki
      - ./monitoring/loki-data/wal:/wal

  tempo:
    image: grafana/tempo:1.5.0
    ports:
      - "3200:3200"
    command:
      - "-config.file=/etc/tempo/config.yaml"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/config.yaml:ro

  promtail:
    image: grafana/promtail:2.9.0
    depends_on:
      - loki
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pg_movie:
  pg_auth:
  pg_payment:
  redis_movie:
  redis_auth: